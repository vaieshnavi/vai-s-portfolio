<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Vaishnavi Patil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3,h4,h5,h6 { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-white text-charcoal scroll-smooth">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 bg-ivory shadow-md">
    <nav class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="text-xl font-bold tracking-wide">Vai</div>
      <ul class="hidden md:flex space-x-6 text-sm font-medium">
        <li><a href="index.html" class="hover:text-dusty-rose">Home</a></li>
        <li><a href="about.html" class="hover:text-dusty-rose">About</a></li>
        <li><a href="education.html" class="hover:text-dusty-rose">Education</a></li>
        <li><a href="extras.html" class="hover:text-dusty-rose">Extras</a></li>
        <li><a href="contact.html" class="hover:text-dusty-rose">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="py-20 px-6 max-w-4xl mx-auto">
    <h2 class="text-4xl font-bold mb-10">Contact Me</h2>
    <p class="mb-6 text-gray-700">Feel free to reach out via LinkedIn or email — or leave a message below!</p>
    
    <form class="space-y-6">
      <input type="text" placeholder="Your Name" class="w-full p-3 border rounded-lg" required>
      <input type="email" placeholder="Your Email" class="w-full p-3 border rounded-lg" required>
      <textarea placeholder="Your Message" class="w-full p-3 border rounded-lg h-32" required></textarea>
      <button type="submit" class="px-6 py-3 bg-dusty-rose text-white rounded-xl hover:bg-rose-600 transition">Send Message</button>
    </form>

    <div class="mt-12">
      <p>Or reach me at:</p>
      <p class="mt-2"><a href="https://www.linkedin.com/in/patilvaishnavie/" class="text-dusty-rose hover:underline">LinkedIn</a> | <a href="mailto:your-email@example.com" class="text-dusty-rose hover:underline">Email</a></p>
    </div>
  </section>

  <footer class="py-6 text-center text-gray-500">
    2025 Vaishnavi Patil. All rights reserved.
  </footer>

</body>
</html>
